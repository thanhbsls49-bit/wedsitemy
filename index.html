<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Duy h — Trang web cá nhân</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .card {
            background: #ffffff;
            border-radius: 16px;
            padding: 50px 40px;
            max-width: 600px;
            width: 100%;
            text-align: center;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.2);
        }

        .card h1 {
            font-size: 2rem;
            color: #333;
            margin-bottom: 15px;
        }

        .card p {
            font-size: 1.05rem;
            color: #666;
            line-height: 1.6;
            margin-bottom: 20px;
        }

        .domain-box {
            background: #f4f5ff;
            border: 1px dashed #667eea;
            border-radius: 10px;
            padding: 14px 18px;
            margin: 20px 0;
            font-size: 1.05rem;
            color: #4a4a8a;
            word-break: break-all;
        }

        .domain-box a {
            color: #667eea;
            font-weight: 600;
            text-decoration: none;
        }

        .domain-box a:hover {
            text-decoration: underline;
        }

        .btn {
            display: inline-block;
            background: #667eea;
            color: #fff;
            padding: 14px 32px;
            border-radius: 50px;
            text-decoration: none;
            font-weight: 600;
            transition: background 0.3s ease, transform 0.3s ease;
            margin-top: 10px;
        }

        .btn:hover {
            background: #5568d3;
            transform: translateY(-2px);
        }

        footer {
            margin-top: 30px;
            font-size: 0.9rem;
            color: #999;
        }
    </style>
</head>
<body>
    <div class="card">
        <h1>👋 Xin chào, mình là thanh!</h1>
        <p>Đây là trang web đầu tiên của mình, được xây dựng chỉ với HTML và CSS thuần.</p>

        <div class="domain-box">
            🌐 Tên miền của mình:<br>
            <a href="http://duythanh.duckdns.org" target="_blank">duythanh.duckdns.org</a>
        </div>

        <p>Nếu bạn đang đọc được dòng này, nghĩa là tên miền phụ DuckDNS của mình đã hoạt động thành công!</p>

        <a href="mailto:contact@duythanh.duckdns.org" class="btn">📧 Liên hệ với mình</a>

        <footer>&copy; 2026 — duythanh.duckdns.org</footer>
    </div>
</body>
</html>
